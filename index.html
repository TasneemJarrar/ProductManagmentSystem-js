<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Manrope:wght@200..800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/output.css">
</head>

<body class="bg-white text-black dark:bg-gray-900 dark:text-white font-body transition-all duration-300 ease-in-out">

  <header class="font-heading">
    <div class="container mx-auto py-4 px-4 md:px-5">
      <div class="flex justify-between items-center">
        <div class="flex justify-center items-center">
          <p class="text-xl font-bold">Product Managment System</p>
        </div>
        <button id="mode-toggle"
          class="w-9 h-9 rounded-xl hover:bg-gray-300/70 dark:hover:bg-gray-100/40 hover:scale-105  hover:shadow-2xl  dark:shadow-black/40 transition-all font-semibold text-xl">
          <i id="mode-icon" class="fa-regular fa-moon"></i>
        </button>
      </div>
    </div>
  </header>


  <main>
    <section class="inputs pt-12 font-data ">
      <div class="container mx-auto py-4 px-4 md:px-5">
        <div class="flex justify-center align items-center">

          <form action="" class="flex flex-col gap-3 w-full">
            <input type="text" class="w-full p-3 bg-gray-200 dark:bg-gray-700 rounded-2xl outline-0 hover:scale-105" id="title" placeholder="title" required>
            <div class="flex gap-2 flex-row flex-wrap items-center">
              <input type="number" class="w-full p-3 bg-gray-200 dark:bg-gray-700 rounded-2xl outline-0 hover:scale-105" id="price" placeholder="price" required>
              <input type="number" class="w-full p-3 bg-gray-200 dark:bg-gray-700 rounded-2xl outline-0 hover:scale-105" id="taxes" placeholder="taxes" required>
              <div class="flex gap-2 w-full items-center">
                <input type="number" class="w-full p-3 bg-gray-200 dark:bg-gray-700 rounded-2xl outline-0 hover:scale-105" id="ads" placeholder="ads" required>
                <p class="bg-amber-300 rounded-2xl p-3">Total:<span id="total" class="">32998</span></p>
              </div>
            </div>
            <input type="number" class="w-full p-3 bg-gray-200 dark:bg-gray-700 rounded-2xl outline-0 hover:scale-105" id="count" placeholder="quantity" required>
            <input type="text" class="w-full p-3 bg-gray-200 dark:bg-gray-700 rounded-2xl outline-0 hover:scale-105" id="category" placeholder="category" required>
            <button type="submit" class="p-3 bg-purple-400 text-white dark:bg-purple-500 hover:bg-purple-500 dark:hover:bg-purple-400 font-semibold hover:tracking-wider rounded-2xl transition-all duration-300 ease-in-out">Add Product</button>
          </form>

        </div>
      </div>
    </section>

    <section class="outputs pt-12 font-data">
      <div class="container mx-auto py-4 px-4 md:px-5">
        <div class="flex justify-center align items-center">
        
        </div>
      </div>
    </section>
  </main>

  <script src="./assets/js/main.js"></script>

</body>

</html>
